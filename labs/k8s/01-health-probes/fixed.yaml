# Solution: the default nginx root URL returns HTTP 200.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-lab
  namespace: interview-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-lab
  template:
    metadata:
      labels:
        app: health-lab
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: health-lab
  namespace: interview-labs
spec:
  selector:
    app: health-lab
  ports:
    - port: 80
      targetPort: 80
