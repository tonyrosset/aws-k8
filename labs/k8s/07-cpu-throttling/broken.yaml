# Intentionally CPU-bound workload capped at 100m.
# Run only in a disposable Kubernetes sandbox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-lab
  namespace: interview-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-lab
  template:
    metadata:
      labels:
        app: cpu-lab
    spec:
      containers:
        - name: python
          image: python:3.12-alpine
          command: ["python", "-u", "-c"]
          args:
            - |
              import time

              counter = 0
              last = time.monotonic()

              while True:
                  counter += 1
                  now = time.monotonic()
                  if now - last >= 5:
                      print(f"Iterations: {counter}", flush=True)
                      last = now
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
