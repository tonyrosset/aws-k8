name: Docker Build ECR

on:
  push:
    branches:
      - dev
    paths:
      - "apps/python-template/**"
      - ".github/workflows/docker-build-ecr.yml"

jobs:
  build-and-push:
    name: Build and push Python template image
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker build \
            -t ${{ vars.ECR_REPOSITORY_URL }}:${IMAGE_TAG} \
            -t ${{ vars.ECR_REPOSITORY_URL }}:latest \
            apps/python-template

          docker push ${{ vars.ECR_REPOSITORY_URL }}:${IMAGE_TAG}
          docker push ${{ vars.ECR_REPOSITORY_URL }}:latest