apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orion-mongodb
  namespace: fiware-dev
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: orion-mongodb-secret
    creationPolicy: Owner

  data:
    - secretKey: dbPassword
      remoteRef:
        key: aws-k8s-project/dev/mongodb
        property: mongodb-root-password