apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: gitops
spec:
  project: default

  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 1.2.2
      helm:
        valueFiles:
          - $values/platform/helm-values/argocd-image-updater/values.yaml

    - repoURL: https://github.com/tonyrosset/aws-k8.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true